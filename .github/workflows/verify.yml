name: Verify extension

on:
  push:
    branches:
      - main
      - fix/prime-video-one-second-skip
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: prime-video-youtube-ad-skipper
          path: dist/extension
          if-no-files-found: error
