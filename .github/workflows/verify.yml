name: Verify extension

on:
  push:
    branches:
      - main
      - hardening/full-runtime-and-release-tests
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: prime-video-ad-skipper-builds
          path: |
            dist/extension
            dist/extension-with-youtube
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
